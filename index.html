<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Political Compass</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --background: #111111;
      --panel: #171717;
      --panel-strong: #202020;
      --input: #252525;
      --grid-major: #3a3a3a;
      --grid-minor: #242424;
      --axis: #b7b7b7;
      --text: #fbfbfb;
      --muted: #a8a8a8;
      --point: #f4f4f4;
      --point-edge: #111111;
      --selected: #fff176;
      --selected-ring: #ff4081;
      --voronoi-edge: #9be7ff;
      --voronoi-fill: #4fc3f7;
      --category-edge: #39c462;
      --category-fill: #27c35a;
      --category-point: #9ff6b4;
      --category-text: #8fdca3;
      --tooltip: #222222;
      --tooltip-edge: #eeeeee;
      --focus: #7dd3fc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--background);
    }

    .topbar {
      display: grid;
      grid-template-columns: auto auto auto auto minmax(220px, 420px) auto 1fr;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--panel);
      border-bottom: 1px solid #252525;
    }

    .title {
      margin: 0 8px 0 0;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .detail-control {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
    }

    .detail-slider-wrap {
      width: 132px;
      min-width: 112px;
    }

    .detail-slider {
      width: 100%;
      margin: 0;
      accent-color: var(--selected-ring);
      cursor: pointer;
      direction: rtl;
    }

    .detail-slider:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .detail-ticks {
      display: flex;
      justify-content: space-between;
      margin-top: 1px;
      color: var(--text);
      font-size: 10px;
      line-height: 1;
    }

    .search-label {
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
    }

    .search-input {
      width: 100%;
      min-width: 0;
      padding: 6px 9px;
      border: 1px solid #303030;
      border-radius: 4px;
      outline: none;
      background: var(--input);
      color: var(--text);
    }

    .search-input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px rgba(125, 211, 252, 0.18);
    }

    .button-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .button {
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid #333333;
      border-radius: 4px;
      background: #d8d8d8;
      color: #111111;
      cursor: pointer;
      white-space: nowrap;
    }

    .button:hover {
      background: #eeeeee;
    }

    .button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--text);
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
    }

    .toggle input {
      margin: 0;
      accent-color: var(--selected-ring);
    }

    .status {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .body {
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 0;
    }

    .stage {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 8px;
      background: var(--background);
    }

    .plot-shell {
      width: min(100%, calc(100vh - 78px));
      max-width: 100%;
      aspect-ratio: 1;
      min-height: 320px;
      border: 0;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      touch-action: none;
    }

    .side {
      min-height: 0;
      padding: 8px;
      background: var(--background);
      border-left: 1px solid #252525;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .side-heading {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .matches {
      min-height: 0;
      flex: 1;
      overflow: auto;
      border: 1px solid #333333;
      background: #181818;
    }

    .match {
      width: 100%;
      display: block;
      padding: 7px 8px;
      border: 0;
      border-bottom: 1px solid #262626;
      border-radius: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .match:hover,
    .match.active {
      background: #444444;
      color: var(--selected);
    }

    .match-name {
      display: block;
      overflow: hidden;
      font-size: 11px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .match-meta {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
    }

    .empty {
      padding: 10px 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .help {
      margin-top: 12px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .grid-line {
      stroke-linecap: square;
      vector-effect: non-scaling-stroke;
    }

    .major {
      stroke: var(--grid-major);
      stroke-width: 0.75;
      opacity: 0.75;
    }

    .minor {
      stroke: var(--grid-minor);
      stroke-width: 0.45;
      opacity: 0.85;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.2;
      opacity: 0.9;
      vector-effect: non-scaling-stroke;
    }

    .outer-band {
      fill: #050505;
      opacity: 0.28;
    }

    .boundary {
      fill: none;
      stroke: #d0d0d0;
      stroke-width: 2.3;
      opacity: 0.9;
      vector-effect: non-scaling-stroke;
    }

    .cell {
      fill: var(--voronoi-fill);
      fill-opacity: 0.08;
      stroke: var(--voronoi-edge);
      stroke-opacity: 0.52;
      stroke-width: 1.25;
      vector-effect: non-scaling-stroke;
    }

    .category-cell {
      fill: var(--category-fill);
      fill-opacity: 0.035;
      stroke: var(--category-edge);
      stroke-opacity: 0.64;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .point {
      fill: var(--point);
      stroke: var(--point-edge);
      stroke-width: 0.75;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
    }

    .category-point {
      fill: var(--category-point);
      stroke: #06230d;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .label {
      fill: var(--text);
      font-size: 8.5px;
      opacity: 0.82;
      paint-order: stroke;
      stroke: rgba(17, 17, 17, 0.8);
      stroke-width: 2px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .label.selected {
      fill: var(--selected);
      font-size: 9.5px;
      font-weight: 700;
      opacity: 1;
    }

    .category-label {
      fill: var(--category-text);
      font-size: 10px;
      font-weight: 700;
      opacity: 0.98;
      paint-order: stroke;
      stroke: rgba(17, 17, 17, 0.86);
      stroke-width: 2.4px;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .selected-ring {
      fill: none;
      stroke: var(--selected-ring);
      stroke-width: 2.4;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .selected-dot {
      fill: var(--selected);
      stroke: #000000;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .tooltip-box {
      fill: var(--tooltip);
      stroke: var(--tooltip-edge);
      stroke-width: 1;
      opacity: 0.94;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .tooltip-text {
      fill: var(--text);
      font-size: 9px;
      pointer-events: none;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 9px;
      pointer-events: none;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 11px;
      pointer-events: none;
    }

    @media (max-width: 860px), (orientation: portrait) {
      .topbar {
        grid-template-columns: 1fr auto auto;
        gap: 8px;
        padding: 9px 10px;
      }

      .title {
        grid-column: 1 / -1;
        margin: 0;
        font-size: 16px;
      }

      .detail-control {
        grid-column: 1 / -1;
      }

      .search-label {
        display: none;
      }

      .status {
        grid-column: 1 / -1;
        white-space: normal;
      }

      .body {
        display: flex;
        flex-direction: column;
      }

      .stage {
        padding: 8px 8px 4px;
      }

      .plot-shell {
        width: min(100%, 96vw);
        min-height: 280px;
      }

      .side {
        min-height: 170px;
        max-height: 36vh;
        border-left: 0;
        border-top: 1px solid #252525;
      }

      .help {
        display: none;
      }
    }

    @media (max-width: 460px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .button-row {
        justify-content: stretch;
      }

      .button {
        flex: 1;
      }

      .detail-control {
        justify-content: space-between;
      }

      .detail-slider-wrap {
        flex: 1;
        max-width: 160px;
      }

      .plot-shell {
        min-height: 250px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="title">New Political Compass</h1>
      <div class="detail-control" aria-label="Detail level">
        <span>Least detailed</span>
        <div class="detail-slider-wrap"> 
          <input id="detail-slider" class="detail-slider" type="range" min="1" max="10" step="1" value="10" aria-label="Detail level">
          <div class="detail-ticks" aria-hidden="true"><span>10</span><span>9</span><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
        </div>
        <span>Most detailed</span>
      </div>
      <label class="toggle"><input id="show-extremes" type="checkbox">Show extremes</label>
      <label class="search-label" for="search">Search point:</label>
      <input id="search" class="search-input" type="search" autocomplete="off" placeholder="Search point">
      <div class="button-row">
        <button id="clear" class="button" type="button">Clear</button>
        <button id="reset" class="button" type="button">Reset view</button>
      </div>
      <div id="status" class="status">Loading data...</div>
    </header>

    <section class="body">
      <div class="stage">
        <div class="plot-shell">
          <svg id="plot" role="img" aria-label="New Political Compass interactive plot"></svg>
        </div>
      </div>

      <aside class="side">
        <h2 class="side-heading">Matches</h2>
        <div id="matches" class="matches">
          <div class="empty">Type to search by point name or group.</div>
        </div>
        <div class="help">Scroll: zoom<br>Drag: pan<br>Click point: info<br>Esc: clear</div>
      </aside>
    </section>
  </main>

  <script>
    const APP_TITLE = "New Political Compass";
    const DATASETS = [
      {
        label: "Level 1",
        pointPath: "ideology_coordinates.csv",
        categoryPath: "ideology_categories.csv"
      },
      {
        label: "Level 2",
        pointPath: "ideology_coordinates2.csv",
        categoryPath: "ideology_categories2.csv"
      },
      {
        label: "Level 3",
        pointPath: "ideology_coordinates3.csv",
        categoryPath: "ideology_categories3.csv"
      },
      {
        label: "Level 4",
        pointPath: "ideology_coordinates4.csv",
        categoryPath: "ideology_categories4.csv"
      },
      {
        label: "Level 5",
        pointPath: "ideology_coordinates5.csv",
        categoryPath: "ideology_categories5.csv"
      },
      {
        label: "Level 6",
        pointPath: "ideology_coordinates6.csv",
        categoryPath: "ideology_categories6.csv"
      },
      {
        label: "Level 7",
        pointPath: "ideology_coordinates7.csv",
        categoryPath: "ideology_categories7.csv"
      },
      {
        label: "Level 8",
        pointPath: "ideology_coordinates8.csv",
        categoryPath: "ideology_categories8.csv"
      },
      {
        label: "Level 9",
        pointPath: "ideology_coordinates9.csv",
        categoryPath: "ideology_categories9.csv"
      },
      {
        label: "Level 10",
        pointPath: "ideology_coordinates10.csv",
        categoryPath: "ideology_categories10.csv"
      }
    ];
    const GRAPH_MIN = -11;
    const GRAPH_MAX = 11;
    const COMPASS_MIN = -10;
    const COMPASS_MAX = 10;
    const WORLD_MIN = GRAPH_MIN;
    const WORLD_MAX = GRAPH_MAX;
    const MIN_VIEW_SPAN = 0.75;
    const SEARCH_FOCUS_SPAN = 6;
    const MAX_SEARCH_RESULTS = 15;
    const PLOT_SIZE = 1000;
    const POINT_RADIUS = 3.4;
    const LABEL_SIZE = 8.5;
    const SELECTED_LABEL_SIZE = 9.5;
    const CATEGORY_LABEL_SIZE = 10;
    const MOBILE_LABEL_BOOST = 1.3;
    const LABEL_EDGE_MARGIN_PIXELS = 2;
    const LABEL_PADDING_PIXELS = 0.5;
    const LABEL_OFFSET_PIXELS = 4;
    const CATEGORY_LABEL_OFFSET_PIXELS = 5;
    const LABEL_ZOOMED_OUT_FRACTION = 0.32;
    const LABEL_ZOOM_CURVE = 1.15;
    const LABEL_MIN_VISIBLE = 28;
    const LABEL_WIDTH_FACTOR = 0.46;
    const LABEL_HEIGHT_FACTOR = 1.0;
    const LABEL_ZOOM_SCALE_MAX = 2.2;
    const LABEL_PRIORITY_FRACTION = 0.45;
    const LABEL_OPEN_SPACE_MIN_PIXELS = 48;
    const MANDATORY_LABEL_VORONOI_AREA = 4;

    const state = {
      datasets: [],
      activeDatasetIndex: DATASETS.length - 1,
      points: [],
      categoryPoints: [],
      warnings: [],
      categoryWarnings: [],
      selectedIndex: null,
      matches: [],
      transform: d3.zoomIdentity,
      coordIndex: new Map(),
      categoryCoordKeys: new Set(),
      voronoiAreas: new Map(),
      categoryVoronoiAreas: new Map(),
      ideologyNameFrequency: new Map(),
      categoryNameFrequency: new Map(),
      visibleIdeologyLabelIndices: new Set(),
      visibleCategoryPoints: [],
      showExtremes: false,
      viewBounds: {
        minX: COMPASS_MIN,
        maxX: COMPASS_MAX,
        minY: COMPASS_MIN,
        maxY: COMPASS_MAX
      }
    };

    const elements = {
      detailSlider: document.getElementById("detail-slider"),
      showExtremes: document.getElementById("show-extremes"),
      search: document.getElementById("search"),
      clear: document.getElementById("clear"),
      reset: document.getElementById("reset"),
      status: document.getElementById("status"),
      matches: document.getElementById("matches"),
      svg: d3.select("#plot")
    };

    const xScale = d3.scaleLinear().domain([WORLD_MIN, WORLD_MAX]).range([0, PLOT_SIZE]);
    const yScale = d3.scaleLinear().domain([WORLD_MIN, WORLD_MAX]).range([PLOT_SIZE, 0]);

    elements.svg.attr("viewBox", `0 0 ${PLOT_SIZE} ${PLOT_SIZE}`);

    const root = elements.svg.append("g");
    const gridLayer = root.append("g").attr("class", "grid-layer");
    const cellLayer = root.append("g").attr("class", "cell-layer");
    const categoryCellLayer = root.append("g").attr("class", "category-cell-layer");
    const categoryPointLayer = root.append("g").attr("class", "category-point-layer");
    const pointLayer = root.append("g").attr("class", "point-layer");
    const categoryLabelLayer = elements.svg.append("g").attr("class", "category-label-layer");
    const labelLayer = elements.svg.append("g").attr("class", "label-layer");
    const selectedLayer = elements.svg.append("g").attr("class", "selected-layer");
    const overlay = elements.svg.append("rect")
      .attr("width", PLOT_SIZE)
      .attr("height", PLOT_SIZE)
      .attr("fill", "transparent")
      .attr("pointer-events", "all");

    const zoom = d3.zoom()
      .scaleExtent([1, 100])
      .translateExtent([[0, 0], [PLOT_SIZE, PLOT_SIZE]])
      .extent([[0, 0], [PLOT_SIZE, PLOT_SIZE]])
      .filter((event) => !event.ctrlKey || event.type === "wheel")
      .on("zoom", (event) => {
        state.transform = event.transform;
        applyTransform();
      });

    elements.svg.call(zoom);
    overlay.lower();

    function csvRows(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let index = 0; index < text.length; index += 1) {
        const char = text[index];
        const next = text[index + 1];

        if (quoted) {
          if (char === '"' && next === '"') {
            field += '"';
            index += 1;
          } else if (char === '"') {
            quoted = false;
          } else {
            field += char;
          }
          continue;
        }

        if (char === '"') {
          quoted = true;
        } else if (char === ",") {
          row.push(field);
          field = "";
        } else if (char === "\n") {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else if (char !== "\r") {
          field += char;
        }
      }

      if (field.length || row.length) {
        row.push(field);
        rows.push(row);
      }

      return rows;
    }

    function parsePoints(text) {
      const rows = csvRows(text).filter((row) => row.some((value) => value.trim() !== ""));
      if (!rows.length) {
        throw new Error("The CSV file is empty.");
      }

      const headers = rows[0].map((header) => header.trim().toLowerCase());
      const nameColumn = headers.indexOf("name");
      const xColumn = headers.indexOf("x");
      const yColumn = headers.indexOf("y");
      const groupColumn = headers.indexOf("group");

      if (nameColumn === -1 || xColumn === -1 || yColumn === -1) {
        throw new Error("The CSV is missing required column(s). Expected at least: name,x,y");
      }

      const points = [];
      const warnings = [];
      let fallbackCounter = 1;

      rows.slice(1).forEach((row, rowIndex) => {
        const rowNumber = rowIndex + 2;
        const rawX = row[xColumn];
        const rawY = row[yColumn];
        const x = Number(rawX);
        const y = Number(rawY);

        if (!Number.isFinite(x) || !Number.isFinite(y)) {
          warnings.push(`Skipped row ${rowNumber}: x/y values must be numeric.`);
          return;
        }

        const rawName = (row[nameColumn] || "").trim();
        const rawGroup = groupColumn >= 0 ? (row[groupColumn] || "").trim() : "";
        points.push({
          name: rawName || `Point ${fallbackCounter++}`,
          x,
          y,
          group: rawGroup || null,
          rowNumber
        });
      });

      if (!points.length) {
        throw new Error("No valid finite points were found in the CSV.");
      }

      return { points, warnings };
    }

    function formatNumber(value) {
      return Number.parseFloat(value.toFixed(6)).toString();
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function currentGraphBounds() {
      return state.showExtremes
        ? { min: WORLD_MIN, max: WORLD_MAX }
        : { min: COMPASS_MIN, max: COMPASS_MAX };
    }

    function isInGraphBounds(point) {
      const bounds = currentGraphBounds();
      return point.x >= bounds.min && point.x <= bounds.max && point.y >= bounds.min && point.y <= bounds.max;
    }

    function updateViewBounds() {
      const bounds = currentGraphBounds();
      const allPoints = [...state.points, ...state.categoryPoints].filter(isInGraphBounds);
      const xValues = [bounds.min, bounds.max, ...allPoints.map((point) => point.x)];
      const yValues = [bounds.min, bounds.max, ...allPoints.map((point) => point.y)];
      let minX = Math.min(...xValues);
      let maxX = Math.max(...xValues);
      let minY = Math.min(...yValues);
      let maxY = Math.max(...yValues);
      const xPadding = minX === bounds.min && maxX === bounds.max ? 0 : 0.25;
      const yPadding = minY === bounds.min && maxY === bounds.max ? 0 : 0.25;
      minX -= xPadding;
      maxX += xPadding;
      minY -= yPadding;
      maxY += yPadding;

      const span = Math.max(maxX - minX, maxY - minY);
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;

      state.viewBounds = {
        minX: centerX - span / 2,
        maxX: centerX + span / 2,
        minY: centerY - span / 2,
        maxY: centerY + span / 2
      };
      xScale.domain([state.viewBounds.minX, state.viewBounds.maxX]);
      yScale.domain([state.viewBounds.minY, state.viewBounds.maxY]);
    }

    function compassRect() {
      const left = xScale(COMPASS_MIN);
      const right = xScale(COMPASS_MAX);
      const top = yScale(COMPASS_MAX);
      const bottom = yScale(COMPASS_MIN);
      return { left, right, top, bottom };
    }

    function graphRect() {
      const bounds = currentGraphBounds();
      const left = xScale(bounds.min);
      const right = xScale(bounds.max);
      const top = yScale(bounds.max);
      const bottom = yScale(bounds.min);
      return { left, right, top, bottom };
    }

    function compactViewportBoost() {
      return window.matchMedia("(max-width: 860px), (orientation: portrait)").matches
        ? MOBILE_LABEL_BOOST
        : 1;
    }

    function labelZoomScale() {
      return clamp(Math.sqrt(Math.max(state.transform.k, 1)), 1, LABEL_ZOOM_SCALE_MAX);
    }

    function labelSize(baseSize) {
      return baseSize * compactViewportBoost() * labelZoomScale();
    }

    function pointIsVisible(point) {
      const px = state.transform.applyX(xScale(point.x));
      const py = state.transform.applyY(yScale(point.y));
      return px >= 0 && px <= PLOT_SIZE && py >= 0 && py <= PLOT_SIZE;
    }

    function labelBoxesOverlap(first, second) {
      const padding = LABEL_PADDING_PIXELS;
      return !(
        first.right + padding <= second.left
        || first.left >= second.right + padding
        || first.bottom + padding <= second.top
        || first.top >= second.bottom + padding
      );
    }

    function labelLimit(visibleCount) {
      if (visibleCount <= 12) {
        return visibleCount;
      }

      const maxSpan = Math.max(
        state.viewBounds.maxX - state.viewBounds.minX,
        state.viewBounds.maxY - state.viewBounds.minY
      );
      const currentSpan = maxSpan / Math.max(state.transform.k, 1);
      const spanRange = Math.max(maxSpan - MIN_VIEW_SPAN, 1);
      const zoomProgress = clamp((maxSpan - currentSpan) / spanRange, 0, 1);
      const labelFraction = LABEL_ZOOMED_OUT_FRACTION
        + (1 - LABEL_ZOOMED_OUT_FRACTION) * (zoomProgress ** LABEL_ZOOM_CURVE);
      return Math.min(visibleCount, Math.max(LABEL_MIN_VISIBLE, Math.ceil(visibleCount * labelFraction)));
    }

    function labelPlacement(point, text, baseSize, offsetPixels, occupiedBoxes) {
      const naturalSize = labelSize(baseSize);
      const maxSize = Math.max(
        3,
        (PLOT_SIZE - LABEL_EDGE_MARGIN_PIXELS * 2 - 8) / (Math.max(text.length, 1) * LABEL_WIDTH_FACTOR)
      );
      const size = Math.min(naturalSize, maxSize);
      const width = Math.max(text.length, 1) * size * LABEL_WIDTH_FACTOR;
      const height = size * LABEL_HEIGHT_FACTOR;
      const px = state.transform.applyX(xScale(point.x));
      const py = state.transform.applyY(yScale(point.y));

      if (px < 0 || px > PLOT_SIZE || py < 0 || py > PLOT_SIZE) {
        return null;
      }

      const horizontalOrder = px <= PLOT_SIZE / 2 ? ["start", "end"] : ["end", "start"];
      const verticalOrder = py <= PLOT_SIZE / 2 ? ["bottom", "top"] : ["top", "bottom"];
      const orientations = [
        [horizontalOrder[0], verticalOrder[0]],
        [horizontalOrder[1], verticalOrder[0]],
        ["middle", verticalOrder[0]],
        [horizontalOrder[0], verticalOrder[1]],
        [horizontalOrder[1], verticalOrder[1]],
        ["middle", verticalOrder[1]]
      ];

      function clampBox(box) {
        const leftLimit = LABEL_EDGE_MARGIN_PIXELS;
        const rightLimit = PLOT_SIZE - LABEL_EDGE_MARGIN_PIXELS;
        const topLimit = LABEL_EDGE_MARGIN_PIXELS;
        const bottomLimit = PLOT_SIZE - LABEL_EDGE_MARGIN_PIXELS;
        const left = width >= rightLimit - leftLimit
          ? leftLimit
          : clamp(box.left, leftLimit, rightLimit - width);
        const top = height >= bottomLimit - topLimit
          ? topLimit
          : clamp(box.top, topLimit, bottomLimit - height);
        return { left, top, right: left + width, bottom: top + height };
      }

      for (const [anchor, vertical] of orientations) {
        let left;
        let right;
        let top;
        let bottom;

        if (anchor === "start") {
          left = px + offsetPixels;
          right = left + width;
        } else if (anchor === "end") {
          right = px - offsetPixels;
          left = right - width;
        } else {
          left = px - width / 2;
          right = px + width / 2;
        }

        if (vertical === "bottom") {
          top = py + offsetPixels;
          bottom = top + height;
        } else {
          bottom = py - offsetPixels;
          top = bottom - height;
        }

        const box = clampBox({ left, top, right, bottom });
        if (occupiedBoxes.some((occupied) => labelBoxesOverlap(box, occupied))) {
          continue;
        }

        const x = anchor === "start"
          ? box.left
          : anchor === "end"
            ? box.right
            : (box.left + box.right) / 2;
        const y = box.top + size;
        return { x, y, anchor, size, box };
      }

      return null;
    }

    function coordKey(point) {
      return `${point.x.toFixed(12)},${point.y.toFixed(12)}`;
    }

    function polygonArea(coords) {
      if (!coords || coords.length < 3) {
        return 0;
      }

      let area = 0;
      coords.forEach(([x1, y1], index) => {
        const [x2, y2] = coords[(index + 1) % coords.length];
        area += x1 * y2 - x2 * y1;
      });
      return Math.abs(area) / 2;
    }

    function screenPolygonAreaToDataArea(area) {
      const [minX, maxX] = xScale.domain();
      const [minY, maxY] = yScale.domain();
      return area * Math.abs((maxX - minX) / PLOT_SIZE) * Math.abs((maxY - minY) / PLOT_SIZE);
    }

    function normalizeLabelKey(text) {
      return text.trim().toLowerCase().replace(/\s+/g, " ");
    }

    function buildNameFrequency(pointGroups) {
      const frequencies = new Map();
      pointGroups.forEach((points) => {
        const keys = new Set(points.map((point) => normalizeLabelKey(point.name)));
        keys.forEach((key) => frequencies.set(key, (frequencies.get(key) || 0) + 1));
      });
      return frequencies;
    }

    function buildCoordIndex() {
      state.coordIndex = new Map();
      state.points.forEach((point, index) => {
        const key = coordKey(point);
        if (!state.coordIndex.has(key)) {
          state.coordIndex.set(key, []);
        }
        state.coordIndex.get(key).push(index);
      });
      state.categoryCoordKeys = new Set(state.categoryPoints.map(coordKey));
    }

    function ideologySortKey(index, point) {
      const selectedRank = index === state.selectedIndex ? 0 : 1;
      const frequency = state.ideologyNameFrequency.get(normalizeLabelKey(point.name)) || 0;
      return [selectedRank, -frequency, point.rowNumber, point.name.toLowerCase()];
    }

    function categorySortKey(point) {
      const frequency = state.categoryNameFrequency.get(normalizeLabelKey(point.name)) || 0;
      return [-frequency, point.rowNumber, point.name.toLowerCase()];
    }

    function compareKeys(first, second) {
      for (let index = 0; index < first.length; index += 1) {
        if (first[index] < second[index]) {
          return -1;
        }
        if (first[index] > second[index]) {
          return 1;
        }
      }
      return 0;
    }

    function pointScreenOpenness(point, neighborPoints) {
      const px = state.transform.applyX(xScale(point.x));
      const py = state.transform.applyY(yScale(point.y));
      let nearestDistance = Infinity;

      neighborPoints.forEach((neighbor) => {
        if (neighbor === point) {
          return;
        }

        const neighborX = state.transform.applyX(xScale(neighbor.x));
        const neighborY = state.transform.applyY(yScale(neighbor.y));
        const distance = Math.hypot(px - neighborX, py - neighborY);
        nearestDistance = Math.min(nearestDistance, distance);
      });

      return nearestDistance;
    }

    function visibleIdeologyPointsByPriority() {
      return state.points
        .map((point, index) => ({ point, index }))
        .filter(({ point }) => (
          isInGraphBounds(point)
          && pointIsVisible(point)
          && !state.categoryCoordKeys.has(coordKey(point))
        ))
        .sort((first, second) => compareKeys(
          ideologySortKey(first.index, first.point),
          ideologySortKey(second.index, second.point)
        ));
    }

    function updateStatus() {
      const dataset = state.datasets[state.activeDatasetIndex];
      const datasetLabel = dataset ? dataset.label : "Dataset";
      const groupCount = state.points.filter((point) => point.group).length;
      const skippedCount = state.warnings.length + state.categoryWarnings.length;
      const warningText = skippedCount ? ` | ${skippedCount} skipped row(s)` : "";
      elements.status.textContent = `${datasetLabel} | ${state.points.length} ideology point(s) | ${state.categoryPoints.length} category point(s) | ${groupCount} with group values${warningText}`;
    }

    function drawGrid() {

      if (state.showExtremes) {

          .attr("x", rect.right)

          .attr("x", graph.left)

        gridLayer.append("rect")

      }

      gridLayer.selectAll(".minor-x")

      gridLayer.selectAll(".minor-y")

        .join("line")
        .attr("class", "grid-line minor")
        .attr("x1", graph.left)
        .attr("x2", graph.right)
        .attr("y1", (d) => yScale(d))
        .attr("y2", (d) => yScale(d));

      gridLayer.selectAll(".major-x")
        .data(majorTicks)
        .join("line")
        .attr("class", "grid-line major")
        .attr("x1", (d) => xScale(d))
        .attr("x2", (d) => xScale(d))
        .attr("y1", graph.top)
        .attr("y2", graph.bottom);

      gridLayer.selectAll(".major-y")
        .data(majorTicks)
        .join("line")
        .attr("class", "grid-line major")
        .attr("x1", graph.left)
        .attr("x2", graph.right)
        .attr("y1", (d) => yScale(d))
        .attr("y2", (d) => yScale(d));

      gridLayer.append("line")
        .attr("class", "axis")
        .attr("x1", graph.left)
        .attr("x2", graph.right)
        .attr("y1", yScale(0))
        .attr("y2", yScale(0));

      gridLayer.append("line")
        .attr("class", "axis")
        .attr("x1", xScale(0))
        .attr("x2", xScale(0))
        .attr("y1", graph.top)
        .attr("y2", graph.bottom);

      gridLayer.append("rect")
        .attr("class", "boundary")
        .attr("x", rect.left)
        .attr("y", rect.top)
        .attr("width", rect.right - rect.left)
        .attr("height", rect.bottom - rect.top);

      gridLayer.selectAll(".tick-x")
        .data(majorTicks)
        .join("text")
        .attr("class", "tick-label")
        .attr("x", (d) => xScale(d) + 3)
        .attr("y", yScale(0) - 5)
        .text((d) => d);

      gridLayer.selectAll(".tick-y")
        .data(majorTicks.filter((d) => d !== 0))
        .join("text")
        .attr("class", "tick-label")
        .attr("x", xScale(0) + 5)
        .attr("y", (d) => yScale(d) - 3)
        .text((d) => d);

      gridLayer.append("text")
        .attr("class", "axis-label")
        .attr("x", rect.right - 16)
        .attr("y", yScale(0) - 8)
        .text("x");

      gridLayer.append("text")
        .attr("class", "axis-label")
        .attr("x", xScale(0) + 8)
        .attr("y", rect.top + 16)

    }

    function uniquePoints(points) {
      const unique = [];
      const seen = new Set();

      points.forEach((point) => {
        const key = coordKey(point);
        if (!seen.has(key)) {
          seen.add(key);
          unique.push(point);
        }
      });

      return unique;
    }

    function drawVoronoiCells(layer, points, className, areaMap) {
      layer.selectAll("*").remove();
      areaMap.clear();
      const unique = uniquePoints(points.filter(isInGraphBounds));
      if (unique.length < 3) {
        return;
      }

      const delaunay = d3.Delaunay.from(unique, (point) => xScale(point.x), (point) => yScale(point.y));
      const rect = graphRect();
      const voronoi = delaunay.voronoi([rect.left, rect.top, rect.right, rect.bottom]);

      unique.forEach((point, index) => {
        const polygon = voronoi.cellPolygon(index);
        if (!polygon) {
          return;
        }
        const screenArea = polygonArea(polygon);
        areaMap.set(coordKey(point), screenPolygonAreaToDataArea(screenArea));
      });

      layer.selectAll("path")
        .data(unique)
        .join("path")
        .attr("class", className)
        .attr("d", (_point, index) => voronoi.renderCell(index));
    }

    function drawVoronoi() {
      drawVoronoiCells(cellLayer, state.points, "cell", state.voronoiAreas);
      drawVoronoiCells(categoryCellLayer, state.categoryPoints, "cell category-cell", state.categoryVoronoiAreas);
    }

    function drawPoints(pointIndices) {
      const indices = new Set(pointIndices);
      const inverseScale = 1 / Math.max(state.transform.k, 1);
      if (
        state.selectedIndex !== null
        && isInGraphBounds(state.points[state.selectedIndex])
        && pointIsVisible(state.points[state.selectedIndex])
      ) {
        indices.add(state.selectedIndex);
      }

      const pointData = [...indices]
        .sort((first, second) => first - second)
        .map((index) => ({ index, point: state.points[index] }));

      pointLayer.selectAll("circle")
        .data(pointData, ({ index }) => index)
        .join("circle")
        .attr("class", "point")
        .attr("r", POINT_RADIUS * inverseScale)
        .attr("stroke-width", 0.75 * inverseScale)
        .attr("cx", ({ point }) => xScale(point.x))
        .attr("cy", ({ point }) => yScale(point.y))
        .on("click", (event, { index }) => {
          event.stopPropagation();
          selectPoint(index, false);
        });
    }

    function drawCategoryPoints(points) {
      const inverseScale = 1 / Math.max(state.transform.k, 1);
      categoryPointLayer.selectAll("circle")
        .data(points, (point) => coordKey(point))
        .join("circle")
        .attr("class", "category-point")
        .attr("r", POINT_RADIUS * 1.7 * inverseScale)
        .attr("stroke-width", inverseScale)
        .attr("cx", (point) => xScale(point.x))
        .attr("cy", (point) => yScale(point.y));
    }

    function drawLabels(visiblePoints, occupiedBoxes) {
      const labelBoxes = [...occupiedBoxes];
      const labelCount = labelLimit(visiblePoints.length);
      const visibleLabelData = [];
      const drawnIndices = new Set();
      const mandatoryLabelAreas = new Map();
      const neighborPoints = [
        ...visiblePoints.map(({ point }) => point),
        ...state.categoryPoints.filter((point) => isInGraphBounds(point) && pointIsVisible(point))
      ];

      visiblePoints.forEach(({ point, index }) => {
        const area = state.voronoiAreas.get(coordKey(point)) || 0;
        if (area > MANDATORY_LABEL_VORONOI_AREA) {
          mandatoryLabelAreas.set(index, area);
        }
      });

      function tryDrawLabel(point, index, respectLimit = true) {
        if ((respectLimit && drawnIndices.size >= labelCount) || drawnIndices.has(index)) {
          return false;
        }

        const baseSize = index === state.selectedIndex ? SELECTED_LABEL_SIZE : LABEL_SIZE;
        const placed = labelPlacement(point, point.name, baseSize, LABEL_OFFSET_PIXELS, labelBoxes);
        if (!placed) {
          return false;
        }

        visibleLabelData.push({ point, index, placed });
        labelBoxes.push(placed.box);
        drawnIndices.add(index);
        return true;
      }

      const mandatoryPoints = visiblePoints
        .filter(({ index }) => mandatoryLabelAreas.has(index))
        .sort((first, second) => {
          const firstArea = mandatoryLabelAreas.get(first.index) || 0;
          const secondArea = mandatoryLabelAreas.get(second.index) || 0;
          if (firstArea !== secondArea) {
            return secondArea - firstArea;
          }
          return compareKeys(
            ideologySortKey(first.index, first.point),
            ideologySortKey(second.index, second.point)
          );
        });

      for (const { point, index } of mandatoryPoints) {
        tryDrawLabel(point, index, false);
      }

      const priorityTarget = Math.min(
        labelCount,
        Math.max(1, Math.ceil(labelCount * LABEL_PRIORITY_FRACTION))
      );

      for (const { point, index } of visiblePoints) {
        if (drawnIndices.size >= priorityTarget) {
          break;
        }
        tryDrawLabel(point, index);
      }

      const openSpacePoints = visiblePoints
        .filter(({ index }) => !drawnIndices.has(index))
        .map(({ point, index }) => ({
          point,
          index,
          openness: pointScreenOpenness(point, neighborPoints)
        }))
        .filter(({ openness }) => openness >= LABEL_OPEN_SPACE_MIN_PIXELS)
        .sort((first, second) => {
          if (first.openness !== second.openness) {
            return second.openness - first.openness;
          }
          return compareKeys(
            ideologySortKey(first.index, first.point),
            ideologySortKey(second.index, second.point)
          );
        });

      for (const { point, index } of openSpacePoints) {
        if (drawnIndices.size >= labelCount) {
          break;
        }
        tryDrawLabel(point, index);
      }

      for (const { point, index } of visiblePoints) {
        if (drawnIndices.size >= labelCount) {
          break;
        }
        tryDrawLabel(point, index);
      }

      state.visibleIdeologyLabelIndices = new Set(visibleLabelData.map(({ index }) => index));

      labelLayer.selectAll("text")
        .data(visibleLabelData, ({ index }) => index)
        .join("text")
        .attr("class", ({ index }) => index === state.selectedIndex ? "label selected" : "label")
        .attr("x", ({ placed }) => placed.x)
        .attr("y", ({ placed }) => placed.y)
        .attr("text-anchor", ({ placed }) => placed.anchor)
        .style("font-size", ({ placed }) => `${placed.size}px`)
        .style("stroke-width", ({ placed }) => `${Math.max(2, placed.size * 0.22)}px`)
        .text(({ point }) => point.name);

      return state.visibleIdeologyLabelIndices;
    }

    function drawCategoryLabels() {
      const labelBoxes = [];
      const visibleCategoryData = [];
      const visiblePoints = state.categoryPoints
        .filter((point) => isInGraphBounds(point) && pointIsVisible(point))
        .sort((first, second) => {
          const firstArea = state.categoryVoronoiAreas.get(coordKey(first)) || 0;
          const secondArea = state.categoryVoronoiAreas.get(coordKey(second)) || 0;
          const firstIsMandatory = firstArea > MANDATORY_LABEL_VORONOI_AREA;
          const secondIsMandatory = secondArea > MANDATORY_LABEL_VORONOI_AREA;

          if (firstIsMandatory !== secondIsMandatory) {
            return firstIsMandatory ? -1 : 1;
          }
          if (firstIsMandatory && firstArea !== secondArea) {
            return secondArea - firstArea;
          }
          return compareKeys(categorySortKey(first), categorySortKey(second));
        });

      visiblePoints.forEach((point) => {
        const placed = labelPlacement(
          point,
          point.name,
          CATEGORY_LABEL_SIZE,
          CATEGORY_LABEL_OFFSET_PIXELS,
          labelBoxes
        );
        if (!placed) {
          return;
        }
        visibleCategoryData.push({ point, placed });
        labelBoxes.push(placed.box);
      });

      state.visibleCategoryPoints = visibleCategoryData.map(({ point }) => point);

      categoryLabelLayer.selectAll("text")
        .data(visibleCategoryData, ({ point }) => coordKey(point))
        .join("text")
        .attr("class", "category-label")
        .attr("x", ({ placed }) => placed.x)
        .attr("y", ({ placed }) => placed.y)
        .attr("text-anchor", ({ placed }) => placed.anchor)
        .style("font-size", ({ placed }) => `${placed.size}px`)
        .style("stroke-width", ({ placed }) => `${Math.max(2, placed.size * 0.22)}px`)
        .text(({ point }) => point.name);

      return { labelBoxes, points: state.visibleCategoryPoints };
    }

    function pointInfo(index) {
      const point = state.points[index];
      const lines = [point.name, `x: ${formatNumber(point.x)}`, `y: ${formatNumber(point.y)}`];
      if (point.group) {
        lines.push(`group: ${point.group}`);
      }

      const sameSpot = (state.coordIndex.get(coordKey(point)) || [])
        .filter((pointIndex) => pointIndex !== index)
        .map((pointIndex) => state.points[pointIndex].name);

      if (sameSpot.length) {
        let preview = sameSpot.slice(0, 3).join(", ");
        if (sameSpot.length > 3) {
          preview += `, +${sameSpot.length - 3} more`;
        }
        lines.push(`same spot: ${preview}`);
      }

      return lines;
    }

    function drawSelected() {
      selectedLayer.selectAll("*").remove();
      if (state.selectedIndex === null) {
        return;
      }

      const point = state.points[state.selectedIndex];
      if (!isInGraphBounds(point) || !pointIsVisible(point)) {
        return;
      }

      const px = state.transform.applyX(xScale(point.x));
      const py = state.transform.applyY(yScale(point.y));
      const selectedGroup = selectedLayer.append("g").attr("class", "selected");

      selectedGroup.append("circle")
        .attr("class", "selected-ring")
        .attr("r", 14)
        .attr("cx", px)
        .attr("cy", py);

      selectedGroup.append("circle")
        .attr("class", "selected-dot")
        .attr("r", 5.8)
        .attr("cx", px)
        .attr("cy", py);

      const tooltip = selectedGroup.append("g")
        .attr("transform", `translate(${Math.min(px + 14, PLOT_SIZE - 260)}, ${Math.max(py - 4, 16)})`);

      const lines = pointInfo(state.selectedIndex);
      const maxChars = Math.max(...lines.map((line) => line.length));
      const boxWidth = Math.min(260, Math.max(110, maxChars * 5.3 + 18));
      const boxHeight = lines.length * 13 + 14;

      tooltip.append("rect")
        .attr("class", "tooltip-box")
        .attr("rx", 4)
        .attr("ry", 4)
        .attr("x", 0)
        .attr("y", 0)
        .attr("width", boxWidth)
        .attr("height", boxHeight);

      tooltip.selectAll("text")
        .data(lines)
        .join("text")
        .attr("class", "tooltip-text")
        .attr("x", 8)
        .attr("y", (_line, lineIndex) => 16 + lineIndex * 13)
        .text((line) => line);
    }

    function drawAll() {
      drawGrid();
      drawVoronoi();
      applyTransform();
    }

    function applyTransform() {
      root.attr("transform", state.transform);
      const visibleIdeologyPoints = visibleIdeologyPointsByPriority();
      const categoryLabels = drawCategoryLabels();
      drawCategoryPoints(categoryLabels.points);
      const visibleLabelIndices = drawLabels(visibleIdeologyPoints, categoryLabels.labelBoxes);
      drawPoints(visibleLabelIndices);
      drawSelected();
    }

    function renderMatches() {
      elements.matches.innerHTML = "";

      const query = elements.search.value.trim().toLowerCase();
      if (!query) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Type to search by point name or group.";
        elements.matches.append(empty);
        return;
      }

      if (!state.matches.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No matches.";
        elements.matches.append(empty);
        return;
      }

      state.matches.forEach((index) => {
        const point = state.points[index];
        const button = document.createElement("button");
        button.type = "button";
        button.className = `match${index === state.selectedIndex ? " active" : ""}`;
        button.innerHTML = `<span class="match-name"></span><span class="match-meta"></span>`;
        button.querySelector(".match-name").textContent = point.name;
        button.querySelector(".match-meta").textContent = `(${formatNumber(point.x)}, ${formatNumber(point.y)})${point.group ? ` - ${point.group}` : ""}`;
        button.addEventListener("click", () => selectPoint(index, true));
        elements.matches.append(button);
      });
    }

    function renderDetailSlider() {
      elements.detailSlider.value = String(state.activeDatasetIndex + 1);
      elements.detailSlider.setAttribute("aria-valuetext", state.datasets[state.activeDatasetIndex].label);
    }

    function applyDataset(index) {
      const dataset = state.datasets[index];
      state.activeDatasetIndex = index;
      state.points = dataset.points;
      state.categoryPoints = dataset.categoryPoints;
      state.warnings = dataset.warnings;
      state.categoryWarnings = dataset.categoryWarnings;
      state.selectedIndex = null;
      state.matches = [];
      state.transform = d3.zoomIdentity;
      updateViewBounds();
      buildCoordIndex();
    }

    function switchDataset(index) {
      if (index === state.activeDatasetIndex) {
        return;
      }

      applyDataset(index);
      elements.search.value = "";
      renderDetailSlider();
      updateStatus();
      renderMatches();
      elements.svg.call(zoom.transform, d3.zoomIdentity);
      drawAll();
    }

    function applyBoundsMode(showExtremes) {
      state.showExtremes = showExtremes;
      state.selectedIndex = null;
      state.matches = [];
      state.transform = d3.zoomIdentity;
      elements.search.value = "";
      updateViewBounds();
      updateStatus();
      renderMatches();
      elements.svg.call(zoom.transform, d3.zoomIdentity);
      drawAll();
    }

    function updateSearch() {
      const query = elements.search.value.trim().toLowerCase();
      if (!query) {
        state.matches = [];
        if (state.selectedIndex !== null) {
          state.selectedIndex = null;
          drawAll();
          renderMatches();
        } else {
          renderMatches();
        }
        return;
      }

      state.matches = state.points
        .map((point, index) => ({ point, index }))
        .filter(({ point }) => point.name.toLowerCase().includes(query) || (point.group && point.group.toLowerCase().includes(query)))
        .slice(0, MAX_SEARCH_RESULTS)
        .map(({ index }) => index);

      renderMatches();
    }

    function clampTranslate(transform) {
      const tx = Math.min(0, Math.max(PLOT_SIZE - PLOT_SIZE * transform.k, transform.x));
      const ty = Math.min(0, Math.max(PLOT_SIZE - PLOT_SIZE * transform.k, transform.y));
      return d3.zoomIdentity.translate(tx, ty).scale(transform.k);
    }

    function focusPoint(point) {
      const viewSpan = Math.min(
        state.viewBounds.maxX - state.viewBounds.minX,
        state.viewBounds.maxY - state.viewBounds.minY
      );
      const targetScale = viewSpan / SEARCH_FOCUS_SPAN;
      const px = xScale(point.x);
      const py = yScale(point.y);
      const transform = d3.zoomIdentity
        .translate(PLOT_SIZE / 2 - px * targetScale, PLOT_SIZE / 2 - py * targetScale)
        .scale(targetScale);
      elements.svg.transition().duration(220).call(zoom.transform, clampTranslate(transform));
    }

    function selectPoint(index, focus) {
      if (index < 0 || index >= state.points.length) {
        return;
      }

      state.selectedIndex = index;
      drawAll();
      renderMatches();

      if (focus) {
        focusPoint(state.points[index]);
      }
    }

    function clearSelection() {
      elements.search.value = "";
      state.matches = [];
      state.selectedIndex = null;
      drawAll();
      renderMatches();
      elements.search.focus();
    }

    function resetView() {
      elements.svg.transition().duration(220).call(zoom.transform, d3.zoomIdentity);
    }

    elements.search.addEventListener("input", updateSearch);
    elements.detailSlider.addEventListener("input", (event) => {
      switchDataset(Number(event.target.value) - 1);
    });
    elements.showExtremes.addEventListener("change", (event) => {
      applyBoundsMode(event.target.checked);
    });

    elements.search.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        if (state.matches.length) {
          selectPoint(state.matches[0], true);
        }
      } else if (event.key === "Escape") {
        event.preventDefault();
        clearSelection();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        clearSelection();
      }
    });

    window.addEventListener("resize", () => {
      drawAll();
    });

    elements.clear.addEventListener("click", clearSelection);
    elements.reset.addEventListener("click", resetView);
    elements.svg.on("click", () => {
      if (state.selectedIndex !== null) {
        state.selectedIndex = null;
        drawAll();
        renderMatches();
      }
    });

    function fetchText(path) {
      return fetch(path)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Could not load ${path}.`);
          }
          return response.text();
        });
    }

    Promise.all(DATASETS.map((dataset) => Promise.all([
      fetchText(dataset.pointPath),
      fetchText(dataset.categoryPath)
    ]).then(([pointText, categoryText]) => {
      const parsedPoints = parsePoints(pointText);
      const parsedCategories = parsePoints(categoryText);
      return {
        label: dataset.label,
        points: parsedPoints.points,
        categoryPoints: parsedCategories.points,
        warnings: parsedPoints.warnings,
        categoryWarnings: parsedCategories.warnings
      };
    })))
      .then((datasets) => {
        state.datasets = datasets;
        state.ideologyNameFrequency = buildNameFrequency(datasets.map((dataset) => dataset.points));
        state.categoryNameFrequency = buildNameFrequency(datasets.map((dataset) => dataset.categoryPoints));
        applyDataset(datasets.length - 1);
        renderDetailSlider();
        updateStatus();
        renderMatches();
        drawAll();
      })
      .catch((error) => {
        elements.status.textContent = `${APP_TITLE}: ${error.message} Run a local server or publish with GitHub Pages.`;
        elements.matches.innerHTML = `<div class="empty">${error.message}</div>`;
      });
  </script>
</body>
</html>
